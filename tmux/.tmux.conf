# Enable vi mode
setw -g mode-keys vi

# Vim-style selection (macOS compatible)
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy and stay in copy mode
bind-key -T copy-mode-vi 'y' send -X copy-pipe "pbcopy"

# Allow processes to set the outer terminal (iTerm) title via passthrough
set -g allow-passthrough on

# Mouse support
set -g mouse on

# New panes and windows open in the current directory
bind c new-window -c "#{pane_current_path}"
unbind %
bind '\' split-window -h -c "#{pane_current_path}"

# Mouse selection: copy and stay in copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# iTerm tab title: the go<name> alias that opened the session (@go_title, set by __go_open in system/.private), else the session name
set -g set-titles on
set -g set-titles-string '#{?#{@go_title},#{@go_title},#S}'
